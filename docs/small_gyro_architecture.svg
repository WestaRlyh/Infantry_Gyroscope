<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#355070"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1d3557" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="#f6f8fb"/>
  <text x="60" y="58" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="32" font-weight="700" fill="#172b4d">小陀螺控制架构</text>
  <text x="60" y="92" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="17" fill="#5b6b82">底盘独立旋转，云台独立稳向；相对角 theta 是两套坐标系之间的桥梁</text>

  <rect x="60" y="130" width="310" height="500" rx="18" fill="#e8f1fb" stroke="#7aa7d9" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="175" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="24" font-weight="700" fill="#205493">机械与通信层</text>
  <rect x="92" y="210" width="246" height="80" rx="12" fill="#ffffff" stroke="#7aa7d9" stroke-width="2"/>
  <text x="215" y="244" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="20" font-weight="700" fill="#172b4d">四轮麦克纳姆底盘</text>
  <text x="215" y="271" text-anchor="middle" font-family="Arial" font-size="15" fill="#5b6b82">Vx, Vy, omega -> V1...V4</text>
  <rect x="92" y="330" width="246" height="80" rx="12" fill="#ffffff" stroke="#7aa7d9" stroke-width="2"/>
  <text x="215" y="365" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="20" font-weight="700" fill="#172b4d">导电滑环</text>
  <text x="215" y="392" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="15" fill="#5b6b82">电源 + CAN/UART，允许相对旋转</text>
  <rect x="92" y="450" width="246" height="114" rx="12" fill="#ffffff" stroke="#7aa7d9" stroke-width="2"/>
  <text x="215" y="485" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="20" font-weight="700" fill="#172b4d">C 型开发板 / 电调</text>
  <text x="215" y="514" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="15" fill="#5b6b82">裁判系统伤害数据</text>
  <text x="215" y="538" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="15" fill="#5b6b82">电机电流与状态反馈</text>
  <path d="M215 290 L215 330" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M215 410 L215 450" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="445" y="130" width="310" height="500" rx="18" fill="#fff4e6" stroke="#e2a45b" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="175" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="24" font-weight="700" fill="#9a5b13">坐标与控制层</text>
  <rect x="477" y="210" width="246" height="82" rx="12" fill="#ffffff" stroke="#e2a45b" stroke-width="2"/>
  <text x="600" y="245" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="20" font-weight="700" fill="#172b4d">读取相对角 theta</text>
  <text x="600" y="272" text-anchor="middle" font-family="Arial" font-size="15" fill="#5b6b82">Yaw_gimbal - Yaw_chassis</text>
  <rect x="477" y="330" width="246" height="82" rx="12" fill="#ffffff" stroke="#e2a45b" stroke-width="2"/>
  <text x="600" y="365" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="20" font-weight="700" fill="#172b4d">速度坐标变换</text>
  <text x="600" y="392" text-anchor="middle" font-family="Arial" font-size="15" fill="#5b6b82">X,Y = R(theta) [X0,Y0]</text>
  <rect x="477" y="450" width="246" height="114" rx="12" fill="#ffffff" stroke="#e2a45b" stroke-width="2"/>
  <text x="600" y="485" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="20" font-weight="700" fill="#172b4d">模式状态机</text>
  <text x="600" y="514" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="15" fill="#5b6b82">正常跟随 / 小陀螺</text>
  <text x="600" y="538" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="15" fill="#5b6b82">受击后冲击摆动</text>
  <path d="M370 255 L445 255" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M370 500 L445 500" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 292 L600 330" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 412 L600 450" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="830" y="130" width="310" height="500" rx="18" fill="#e9f7ef" stroke="#68b684" stroke-width="2" filter="url(#shadow)"/>
  <text x="860" y="175" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="24" font-weight="700" fill="#247447">执行与稳向层</text>
  <rect x="862" y="210" width="246" height="100" rx="12" fill="#ffffff" stroke="#68b684" stroke-width="2"/>
  <text x="985" y="247" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="20" font-weight="700" fill="#172b4d">四电机 PID / CAN</text>
  <text x="985" y="276" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="15" fill="#5b6b82">执行底盘平移 + 自转</text>
  <rect x="862" y="348" width="246" height="100" rx="12" fill="#ffffff" stroke="#68b684" stroke-width="2"/>
  <text x="985" y="385" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="20" font-weight="700" fill="#172b4d">BMI088 + 云台控制</text>
  <text x="985" y="414" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="15" fill="#5b6b82">Pitch / Yaw 绝对角度闭环</text>
  <rect x="862" y="486" width="246" height="78" rx="12" fill="#ffffff" stroke="#68b684" stroke-width="2"/>
  <text x="985" y="520" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="19" font-weight="700" fill="#172b4d">云台朝向保持</text>
  <text x="985" y="546" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="15" fill="#5b6b82">底盘转，目标不漂移</text>
  <path d="M755 255 L830 255" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M755 500 L830 500" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M985 310 L985 348" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M985 448 L985 486" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="60" y="680" width="1080" height="42" rx="10" fill="#172b4d"/>
  <text x="600" y="708" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial" font-size="17" fill="#ffffff">小陀螺 = 底盘持续提供 omega；云台通过独立闭环维持观察与瞄准</text>
</svg>
